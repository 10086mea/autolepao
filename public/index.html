<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AutoLepao · 路线工作区</title>
  <link rel="stylesheet" href="/vendor/leaflet.css"><link rel="stylesheet" href="/app.css">
  <script src="/vendor/leaflet.js" defer></script><script src="/app.js" defer></script>
</head>
<body>
<header class="topbar">
  <a class="wordmark" href="/">AutoLepao<span>路线工作区</span></a>
  <nav aria-label="主导航"><button data-tab="workspace" class="nav active">画线预约</button><button data-tab="tasks" class="nav">任务记录 <span id="task-count"></span></button></nav>
  <button id="settings-button" class="quiet">设置</button>
</header>
<main id="workspace" class="workspace">
  <aside class="sidebar">
    <div class="section-top"><h1>我的账号</h1><button id="login-button" class="small">＋ 扫码登录</button></div>
    <div id="accounts" class="accounts"><p class="muted">正在读取账号…</p></div>
    <div class="divider"></div>
    <div class="section-top"><h2>预约</h2><span id="worker-status" class="badge">调度器</span></div>
    <form id="reservation">
      <label>跑步账号<select id="account-select" required><option value="">请先扫码登录</option></select></label>
      <label>跑区<select id="zone-select" required><option value="">选择账号后读取</option></select></label>
      <div id="policy-summary" class="muted"></div>
      <div class="two-columns"><label>里程 / km<input id="distance" type="number" min="0.2" max="100" step="0.01" value="2.2" required></label><label>配速 / 分:秒<input id="pace" value="6:00" pattern="[0-9]{1,2}:[0-5][0-9]" required></label></div>
      <fieldset><legend>预约方式</legend><label class="choice"><input name="repeat" type="radio" value="once" checked> 单次预约</label><label class="choice"><input name="repeat" type="radio" value="daily"> 每日自动预约</label></fieldset>
      <label id="target-label" hidden>本学期目标次数<input id="target" type="number" min="1" max="500" placeholder="优先使用乐跑返回的目标"></label>
      <fieldset><legend>路线走法</legend><label class="choice"><input name="closed" type="radio" value="false" checked> 沿画线往返</label><label class="choice"><input name="closed" type="radio" value="true"> 闭合绕圈</label></fieldset>
      <label>开始时间<select id="schedule"><option value="random">有效时段内随机安排</option><option value="earliest">尽快开始</option><option value="fixed">指定时间</option></select></label>
      <label id="fixed-label" hidden>北京时间<input id="fixed-time" type="datetime-local"></label>
      <div id="preview-summary" class="preview-summary" hidden></div>
      <p id="form-error" class="error" role="alert" hidden></p>
      <div class="form-actions"><button type="button" id="preview-button">预览并检查</button><button type="submit" class="primary">预约任务</button></div>
    </form>
  </aside>
  <section class="map-panel" aria-label="地图画线">
    <div class="map-toolbar"><div><h2>画出你的路线</h2><p>点击地图添加点，拖动圆点调整位置。</p></div><button id="locate-button">定位到我</button></div>
    <div id="map"></div>
    <div class="map-bottom"><span id="draw-summary">点击地图开始画线</span><div><button id="undo-button" class="small">撤销</button><button id="clear-button" class="small">清空</button><button id="save-route" class="small">保存路线</button><select id="saved-routes" aria-label="已保存路线"><option value="">载入路线…</option></select></div></div>
    <div id="map-error" class="map-notice" hidden>底图暂时无法加载，可稍后重试。已有画线仍会保留。</div>
  </section>
</main>
<main id="tasks" class="task-page" hidden><div class="section-top"><div><h1>任务记录</h1><p class="muted">时间均为北京时间。远端判定会显示在任务结果中。</p></div><button id="refresh-tasks">刷新</button></div><div id="task-list"></div></main>
<dialog id="qr-dialog"><div class="dialog-head"><h2>扫码登录</h2><button data-close aria-label="关闭">×</button></div><div class="provider-tabs"><button id="wechat-qr" class="primary">微信扫码</button><button id="qq-qr">QQ 扫码</button></div><p class="muted">请选择与乐跑 App 一致的登录方式。</p><div id="qr-image" class="qr-image"></div><p id="qr-status" role="status">请选择登录方式</p></dialog>
<dialog id="settings-dialog"><div class="dialog-head"><h2>应用设置</h2><button data-close aria-label="关闭">×</button></div><p class="muted">微信扫码需要有效的移动应用授权配置。QQ 使用项目中的移动授权流程。</p><form id="settings-form"><label>微信应用 ID<input id="wechat-appid" autocomplete="off"></label><label>微信应用 Secret<input id="wechat-secret" type="password" autocomplete="new-password" placeholder="留空保留当前配置"></label><p id="wechat-config-state" class="muted"></p><button class="primary">保存</button></form></dialog>
<div id="toast" role="status" hidden></div>
</body></html>
