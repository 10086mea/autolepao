services:
  autolepao:
    build: .
    ports:
      - "127.0.0.1:8900:8900"
    environment:
      LEPAO_URL: ${LEPAO_URL:-http://127.0.0.1:8900}
      LEPAO_PASSWORD: ${LEPAO_PASSWORD:?Set LEPAO_PASSWORD in .env first}
      LEPAO_WECHAT_APP_ID: ${LEPAO_WECHAT_APP_ID:-wx5a2e1ff396785475}
      LEPAO_WECHAT_SECRET: ${LEPAO_WECHAT_SECRET:-}
    volumes:
      - lepao-data:/app/data
    restart: unless-stopped

volumes:
  lepao-data:
